  <g class="line l1" transform="translate(0 0)">
    <text x="0" y="184" font-size="13" class="accent">$ whoami</text>
    <text x="105" y="184" font-size="13" class="white">Software engineering · ML · telecom systems</text>
  </g>
  <g class="line l2">
    <text x="0" y="211" font-size="13" class="accent">$ experience</text>
