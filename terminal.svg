<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
<title id="title">subhojit@github: fastfetch</title>
<desc id="desc">Animated terminal-style profile banner for Subhojit Ghosh, Computer Science student at the University of Warwick interested in software engineering, machine learning and telecom systems.</desc>
<defs>
  <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8bf0d8"/><stop offset="1" stop-color="#329b87"/></linearGradient>
  <linearGradient id="face" x1="0" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="#5cc8b0"/><stop offset="1" stop-color="#245e54"/></linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .muted{fill:#928e84}.white{fill:#eee9df}.bright{fill:#f8f5ed}.accent{fill:#7ed9c4}.bold{font-weight:700}
    .line{opacity:0;animation:appear .55s ease-out forwards}.l1{animation-delay:1.0s}.l2{animation-delay:1.35s}.l3{animation-delay:1.7s}.l4{animation-delay:2.05s}
    .typing{transform-origin:left;animation:blink .85s steps(1) infinite}.logo{transform-origin:250px 185px;animation:float 5s ease-in-out infinite}
    .shine{animation:shine 4s ease-in-out infinite}
    @keyframes appear{to{opacity:1;transform:translateY(0)}}
    @keyframes blink{50%{opacity:0}}
    @keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-5px) rotate(1deg)}}
    @keyframes shine{0%,100%{opacity:.45}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.line,.typing,.logo,.shine{animation:none;opacity:1}}
  </style>
</defs>
<!-- terminal shell -->
<rect x="1" y="1" width="998" height="338" rx="14" fill="#171615" stroke="#37342f" stroke-width="1.5"/>
<path d="M15 1H985A14 14 0 0 1 999 15V43H1V15A14 14 0 0 1 15 1Z" fill="#201f1c"/>
<path d="M1 43.5H999" stroke="#302d28"/>
<circle cx="24" cy="22" r="5" fill="#e77970"/><circle cx="43" cy="22" r="5" fill="#dcb86c"/><circle cx="62" cy="22" r="5" fill="#75b895"/>
<text x="500" y="27" text-anchor="middle" font-size="13" class="muted">subhojit@github: ~</text>
<!-- prompt -->
<text x="34" y="75" font-size="15"><tspan class="accent bold">subhojit@github</tspan><tspan class="muted">:</tspan><tspan class="bright bold">~</tspan><tspan class="muted">$ </tspan><tspan class="bright">fastfetch</tspan></text>
<rect x="226" y="59" width="9" height="18" fill="#eee9df" class="typing"/>
<!-- SG mark -->
<g class="logo" filter="url(#glow)">
