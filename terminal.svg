<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Subhojit Ghosh | Developer Terminal</title>
  <desc id="desc">Animated developer terminal banner with an SG monogram, University of Warwick Computer Science, experience at Reliance Jio and Barclays, and interests in AI, software engineering, cybersecurity and automation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070c13"/>
      <stop offset=".55" stop-color="#0a1119"/>
      <stop offset="1" stop-color="#061410"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c6ffec"/>
      <stop offset=".5" stop-color="#4df0bd"/>
      <stop offset="1" stop-color="#00a884"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4df0bd" stop-opacity=".7"/>
      <stop offset=".5" stop-color="#9b8cff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#9b8cff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb">
      <stop offset="0" stop-color="#19e6b1" stop-opacity=".22"/>
      <stop offset="1" stop-color="#19e6b1" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#a8ffe3" stroke-opacity=".045" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.2" fill="#70f5ce" fill-opacity=".16"/>
    </pattern>
    <clipPath id="shell"><rect x="1" y="1" width="1198" height="388" rx="18"/></clipPath>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
      .muted{fill:#7f939a}.mint{fill:#78f7d0}.white{fill:#eaf5f3}.violet{fill:#b3a6ff}
      .label{font-size:11px;letter-spacing:1.8px}
      .in{opacity:0;animation:in .7s ease-out forwards}
      .blink{animation:blink 1.05s steps(2,start) infinite}
      .float{animation:float 5s ease-in-out infinite}
      .pulse{animation:pulse 3.2s ease-in-out infinite}
      .scan{animation:scan 8s linear infinite}
      .dash{stroke-dasharray:8 8;animation:dash 18s linear infinite}
      .spin{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
      .spinr{transform-box:fill-box;transform-origin:center;animation:spin 60s linear infinite reverse}
      .bar{transform-box:fill-box;transform-origin:bottom;animation:bar 2.8s ease-in-out infinite}
      @keyframes in{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
      @keyframes pulse{0%,100%{opacity:.8}50%{opacity:1}}
      @keyframes scan{0%{transform:translateY(-10px);opacity:0}10%{opacity:.4}90%{opacity:.12}100%{transform:translateY(340px);opacity:0}}
      @keyframes dash{to{stroke-dashoffset:-400}}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bar{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
    </style>
  </defs>

  <!-- Shell -->
  <rect x="1" y="1" width="1198" height="388" rx="18" fill="url(#bg)" stroke="#263a42" stroke-width="2"/>
  <g clip-path="url(#shell)">
    <rect x="0" y="0" width="1200" height="46" fill="#111b25"/>
    <rect x="0" y="46" width="1200" height="344" fill="url(#grid)"/>
    <ellipse cx="240" cy="210" rx="270" ry="220" fill="url(#orb)"/>
    <ellipse cx="1040" cy="320" rx="240" ry="140" fill="url(#orb)" opacity=".5"/>
    <rect class="scan" x="0" y="48" width="1200" height="2" fill="#66f5cb"/>
  </g>
  <path d="M2 46H1198" stroke="#1d2e38"/>
  <circle cx="27" cy="23" r="5.5" fill="#ff647c"/>
  <circle cx="47" cy="23" r="5.5" fill="#ffc857"/>
  <circle cx="67" cy="23" r="5.5" fill="#4df0bd"/>
  <text x="600" y="27" text-anchor="middle" class="mono muted" font-size="12">subhojitghosh712</text>
  <g class="pulse"><circle cx="1085" cy="23" r="3.5" fill="#4df0bd" filter="url(#soft)"/></g>
  <text x="1166" y="27" text-anchor="end" class="mono mint" font-size="10" letter-spacing="1.5">ONLINE</text>

  <!-- Monogram card -->
  <g transform="translate(35 70)">
    <rect width="270" height="275" rx="13" fill="#06100e" fill-opacity=".9" stroke="#285548"/>
    <path d="M14 1H110" stroke="#5af3c7" stroke-width="2" filter="url(#soft)"/>
    <text x="18" y="25" class="mono muted label">IDENTITY / SG</text>

    <!-- orbit rings -->
    <g transform="translate(135 112)" fill="none">
      <circle r="84" stroke="#2ce6b0" stroke-opacity=".12"/>
      <circle class="spin" r="72" stroke="#4df0bd" stroke-opacity=".45" stroke-dasharray="3 9" stroke-linecap="round"/>
      <circle class="spinr" r="94" stroke="#9b8cff" stroke-opacity=".3" stroke-dasharray="26 18 4 18"/>
    </g>
    <!-- corner brackets -->
    <g fill="none" stroke="#4df0bd" stroke-opacity=".5" stroke-width="1.5" stroke-linecap="round">
      <path d="M18 44V36Q18 34 20 34H28"/><path d="M252 44V36Q252 34 250 34H242"/>
      <path d="M18 160V168Q18 170 20 170H28"/><path d="M252 160V168Q252 170 250 170H242"/>
    </g>

    <!-- SG strokes -->
    <g class="float" filter="url(#neon)" transform="translate(53 38)" fill="none" stroke="url(#mint)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <path transform="translate(80 70)" d="M42 13C38 5 30 2 22 2C10 2 3 9 3 18C3 38 42 36 42 61C42 73 32 80 22 80C10 80 2 73 0 63"/>
      <path transform="translate(140 70)" d="M42 20C38 8 30 2 22 2C9 2 2 15 2 41C2 67 9 80 22 80C36 80 42 69 42 53V43H24"/>
    </g>

    <path d="M20 186H250" stroke="#2a4c43"/>
    <text x="135" y="208" text-anchor="middle" class="mono mint" font-size="12" letter-spacing="2.4">BUILD / SHIP / ITERATE</text>
    <text x="135" y="229" text-anchor="middle" class="mono muted" font-size="10" letter-spacing="1">LONDON • UNITED KINGDOM</text>
    <g transform="translate(18 244)">
      <rect width="66" height="18" rx="4" fill="#0d2c25" stroke="#1e6c54"/>
      <text x="33" y="12.5" text-anchor="middle" class="mono mint" font-size="9">AI / ML</text>
      <rect x="73" width="80" height="18" rx="4" fill="#17182e" stroke="#4d4688"/>
      <text x="113" y="12.5" text-anchor="middle" class="mono violet" font-size="9">FULL-STACK</text>
      <rect x="160" width="74" height="18" rx="4" fill="#0d2c25" stroke="#1e6c54"/>
      <text x="197" y="12.5" text-anchor="middle" class="mono mint" font-size="9">AUTOMATION</text>
    </g>
  </g>

  <!-- Terminal output -->
  <g class="mono">
    <g class="in" style="animation-delay:.2s">
      <text x="345" y="80" font-size="14"><tspan class="muted">subhojitghosh712@github:~$</tspan> <tspan class="mint">whoami</tspan></text>
      <text x="345" y="114" class="white" font-size="30" font-weight="700">Subhojit Ghosh</text>
      <text x="346" y="137" class="muted" font-size="13.5">BSc Computer Science <tspan class="mint">·</tspan> University of Warwick <tspan class="mint">·</tspan> 2025–2028</text>
    </g>
    <path d="M345 152H1158" stroke="url(#rule)" stroke-width="1.5"/>

    <g class="in" style="animation-delay:.8s">
      <text x="345" y="178" font-size="14"><tspan class="muted">subhojitghosh712@github:~$</tspan> <tspan class="mint">cat focus.txt</tspan></text>
      <text x="345" y="202" class="white" font-size="14">AI / Machine Learning  <tspan class="mint">◆</tspan>  Software Engineering  <tspan class="mint">◆</tspan>  Cybersecurity</text>
      <text x="345" y="224" class="white" font-size="14">Full-stack development  <tspan class="mint">◆</tspan>  Network automation</text>
    </g>

    <g class="in" style="animation-delay:1.4s">
      <text x="345" y="260" font-size="14"><tspan class="muted">subhojitghosh712@github:~$</tspan> <tspan class="mint">ls experience/</tspan></text>
      <text x="345" y="284" class="mint" font-size="14">01</text>
      <text x="380" y="284" class="white" font-size="14">Reliance Jio</text>
      <text x="492" y="284" class="muted" font-size="14">—</text>
      <text x="514" y="284" class="white" font-size="14">Software Engineering Intern (Jun - Sept 2026)</text>
      <text x="345" y="306" class="mint" font-size="14">02</text>
      <text x="380" y="306" class="white" font-size="14">Barclays</text>
      <text x="492" y="306" class="muted" font-size="14">—</text>
      <text x="514" y="306" class="white" font-size="14">Technology Developer Programme (Apr 2026)</text>
    </g>

    <g class="in" style="animation-delay:2s">
      <text x="345" y="345" font-size="14"><tspan class="muted">subhojitghosh712@github:~$</tspan> <tspan class="mint">echo "Ready to build something useful."</tspan><tspan class="blink mint" dx="6">█</tspan></text>
    </g>
  </g>

  <!-- Right panels -->
  <g transform="translate(935 72)">
    <rect width="230" height="58" rx="9" fill="#091310" stroke="#245344"/>
    <circle cx="18" cy="19" r="4" fill="#4df0bd" filter="url(#soft)" class="pulse"/>
    <text x="31" y="23" class="mono mint" font-size="10" letter-spacing="1.2">STATUS: BUILDING</text>
    <text x="16" y="43" class="mono muted" font-size="10">Python · Java · Typescript · C++</text>
  </g>
  <g transform="translate(935 146)">
    <rect width="230" height="124" rx="9" fill="#091310" stroke="#245344"/>
    <text x="16" y="23" class="mono muted label" font-size="10">COMMIT.ACTIVITY</text>
    <g fill="#4df0bd">
      <rect class="bar" x="16"  y="40" width="9" height="66" rx="2" opacity=".55" style="animation-delay:0s"/>
      <rect class="bar" x="32"  y="40" width="9" height="66" rx="2" opacity=".8"  style="animation-delay:.3s"/>
      <rect class="bar" x="48"  y="40" width="9" height="66" rx="2" opacity=".45" style="animation-delay:.6s"/>
      <rect class="bar" x="64"  y="40" width="9" height="66" rx="2" opacity=".9"  style="animation-delay:.9s"/>
      <rect class="bar" x="80"  y="40" width="9" height="66" rx="2" opacity=".6"  style="animation-delay:1.2s"/>
      <rect class="bar" x="96"  y="40" width="9" height="66" rx="2" opacity=".75" style="animation-delay:1.5s"/>
      <rect class="bar" x="112" y="40" width="9" height="66" rx="2" opacity=".5"  style="animation-delay:1.8s"/>
      <rect class="bar" x="128" y="40" width="9" height="66" rx="2" opacity=".85" style="animation-delay:.2s"/>
      <rect class="bar" x="144" y="40" width="9" height="66" rx="2" opacity=".6"  style="animation-delay:.5s"/>
      <rect class="bar" x="160" y="40" width="9" height="66" rx="2" opacity=".9"  style="animation-delay:.8s"/>
      <rect class="bar" x="176" y="40" width="9" height="66" rx="2" opacity=".5"  style="animation-delay:1.1s"/>
      <rect class="bar" x="192" y="40" width="9" height="66" rx="2" opacity=".75" style="animation-delay:1.4s"/>
      <rect class="bar" x="208" y="40" width="9" height="66" rx="2" opacity=".65" style="animation-delay:1.7s"/>
    </g>
  </g>
  <g transform="translate(935 284)">
    <rect width="230" height="58" rx="9" fill="#0d0e1d" stroke="#3d3870"/>
    <text x="16" y="23" class="mono violet label" font-size="10">CURRENTLY</text>
    <text x="16" y="43" class="mono muted" font-size="10">Technology Developer @Barclays</text>
  </g>

  <!-- Footer -->
  <path d="M35 365H1165" fill="none" stroke="#2a6554" stroke-opacity=".55"/>
  <path d="M35 365H1165" class="dash" fill="none" stroke="#4df0bd" stroke-opacity=".75"/>
</svg>
