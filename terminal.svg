  <path d="M95 139L108 126H195L207 139" fill="none" stroke="#a4f6e4" stroke-width="2" class="shine"/>
</g>
<!-- right-hand information -->
<g transform="translate(330 0)">
  <text x="0" y="116" font-size="22" class="bright bold">Subhojit Ghosh</text>
  <text x="0" y="141" font-size="13" class="accent">Computer Science · University of Warwick</text>
